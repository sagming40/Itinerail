# 로컬 개발용 PostgreSQL. `docker compose up -d`로 켜고 `docker compose down`으로 끈다.
# 비밀번호는 config/dev.exs에 생성기가 넣어 둔 postgres/postgres를 그대로 쓴다.
# 내 PC 안(127.0.0.1 · ::1)에서만 열리니까 .env로 따로 빼지 않는다 — 같은 값을 두 곳에 두지 않으려고.
services:
  db:
    image: postgres:18              # 냉장고 모델명 (Postgres 18)
    environment:                    # 처음 켤 때 한 번만 읽는 초기 설정
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:                          # 바깥 5440 → 컨테이너 안 5432로 이어 주는 문
      - "127.0.0.1:5440:5432"       # IPv4 문
      - "[::1]:5440:5432"           # IPv6 문 — 없으면 localhost가 ::1로 갈 때 한참 멈춘다
    volumes:
      - pgdata:/var/lib/postgresql  # 18부터는 .../data가 아니라 여기다
    healthcheck:                    # "냉장고 켜졌어?"를 5초마다 물어본다
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:                           # 컨테이너를 지워도 데이터는 남는 창고
