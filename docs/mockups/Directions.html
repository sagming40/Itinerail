<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerail 방향 비교</title>
<!-- 목업이라 글꼴은 CDN. 실제 구현은 Fontsource 등으로 직접 내려 준다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Gothic+Coding:wght@400;700&family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* ============================================================
   보드(여러 시안을 나란히) — 시안과 상관없는 바깥 틀
   ============================================================ */
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px 16px 64px;
  background: #e9e9ec; color: #222;
  font-family: "Pretendard", system-ui, sans-serif;
}
body.single { background: #d9d9de; }
.board-head { max-width: 1760px; margin: 0 auto 20px; }
.board-head h1 { font-size: 20px; margin: 0 0 6px; }
.board-head p { margin: 0; color: #555; font-size: 14px; line-height: 1.6; }
.board-head code { background: #fff; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.board {
  display: grid; gap: 28px; justify-content: center;
  grid-template-columns: repeat(auto-fill, 390px);
  max-width: 1760px; margin: 0 auto;
}
.slot h2 { font-size: 15px; margin: 0 0 4px; }
.slot .one { font-size: 13px; color: #555; margin: 0 0 10px; line-height: 1.5; min-height: 2.9em; }
.slot .one a { color: inherit; }
.frame {
  width: 390px; height: 800px; overflow: hidden; border-radius: 28px;
  box-shadow: 0 0 0 8px #1b1b1f, 0 18px 40px rgba(0,0,0,.25);
  position: relative;
}
.frame > .app { height: 100%; overflow-y: auto; }

/* 시안 전환 막대 (single 모드) */
.switcher {
  position: fixed; right: 16px; bottom: 16px; z-index: 50;
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  background: #111; color: #eee; padding: 8px 10px; border-radius: 12px; font-size: 13px;
}
.switcher a, .switcher button {
  color: #eee; background: #2a2a2e; border: 0; border-radius: 8px;
  padding: 5px 9px; text-decoration: none; font: inherit; cursor: pointer;
}
.switcher a.cur { background: #f5f5f5; color: #111; }
@media (max-width: 440px) {
  body { padding: 12px 0 72px; }
  .board { grid-template-columns: 1fr; }
  .frame { width: 100%; border-radius: 0; box-shadow: none; height: auto; }
  .frame > .app { height: auto; }
}

/* ============================================================
   앱 공통 뼈대 — 모든 시안이 같은 마크업을 쓰고, 모양만 시안이 덮는다
   ============================================================ */
.app {
  --line: #00a84d;           /* 오늘(고른 날짜)의 노선 색 — 시안 · 날짜가 바꾼다 */
  position: relative; min-height: 100%;
  background: var(--bg); color: var(--fg);
  font-family: var(--font); padding-bottom: 96px;
}
.app * { transition: background-color .2s, color .2s, border-color .2s; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 18px 12px; }
.trip h1 { margin: 0; font-size: 22px; line-height: 1.25; font-family: var(--title-font, var(--font)); }
.trip .dates { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.members { display: flex; }
.av {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  font-size: 13px; font-weight: 700; margin-left: -6px; position: relative;
  background: var(--av-bg); color: var(--av-fg); border: 2px solid var(--bg);
}
.av.off { opacity: .45; }
.av .here {   /* 지금 보고 있는 날짜 표시 (Presence) */
  position: absolute; bottom: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 3px;
  border-radius: 8px; font-size: 9px; line-height: 16px; text-align: center;
  background: var(--here-bg, var(--line)); color: #fff; border: 2px solid var(--bg);
}
.days { display: flex; gap: 8px; padding: 4px 18px 12px; overflow-x: auto; }
.day {
  flex: 0 0 auto; border: 0; cursor: pointer; font: inherit; text-align: left;
  padding: 8px 12px; border-radius: 12px; background: var(--chip); color: var(--fg);
}
.day small { display: block; font-size: 11px; color: var(--muted); }
.day.cur { background: var(--day-color); color: #fff; }
.day.cur small { color: rgba(255,255,255,.85); }

.route { padding: 6px 18px 4px; }
.route svg { width: 100%; height: 92px; display: block; overflow: visible; }
.route .rline { fill: none; stroke: var(--line); stroke-width: 7; stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.1s ease-out backwards; }
.route .st { fill: var(--st-fill, #fff); stroke: var(--line); stroke-width: 4; }
.route .lbl { font-size: 11px; fill: var(--fg); font-family: var(--font); }
@keyframes draw { from { stroke-dashoffset: 1; } }   /* pathLength=1이라 선 길이와 상관없이 0 → 1로 그려진다 */

.stops { list-style: none; margin: 0; padding: 8px 18px; display: grid; gap: 10px; }
.stop { position: relative; display: grid; grid-template-columns: 54px 1fr; gap: 10px;
  padding: 12px; border-radius: 14px; background: var(--card); }
.stop time { align-self: start; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; font-family: var(--num-font, var(--font)); }
.stop .name { font-weight: 700; font-size: 16px; }
.stop .memo { margin: 3px 0 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.stop .tags { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.stop .tags span { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--chip); }
.stop .editing {
  position: absolute; top: -9px; right: 10px; font-size: 11px; padding: 2px 8px; border-radius: 999px;
  background: var(--edit-bg); color: var(--edit-fg); animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .55; } }
.stop.moved { animation: arrive .6s ease-out; }
@keyframes arrive { from { transform: translateY(-6px); box-shadow: 0 0 0 3px var(--line); } }

.settle {
  margin: 14px 18px 0; padding: 12px 14px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center;
  background: var(--card); font-size: 14px;
}
.settle b { font-family: var(--num-font, var(--font)); }
.demo { margin: 12px 18px 0; display: flex; gap: 8px; }
.demo button { font: inherit; font-size: 12px; border: 1px dashed var(--muted); color: var(--muted); background: transparent; padding: 6px 10px; border-radius: 10px; cursor: pointer; }
.fab {
  position: absolute; right: 18px; bottom: 22px; border: 0; cursor: pointer; font: inherit; font-weight: 700;
  padding: 13px 18px; border-radius: 999px; background: var(--fab-bg, var(--line)); color: var(--fab-fg, #fff);
  box-shadow: 0 6px 16px rgba(0,0,0,.2);
}

/* ============================================================
   A · 노선도 — "하루가 한 노선, 장소는 역"
   ============================================================ */
.app[data-d="A"] {
  --bg: #ffffff; --fg: #1a1c20; --muted: #6b7080; --card: #f4f5f7; --chip: #eceef2;
  --av-bg: #1a1c20; --av-fg: #fff; --edit-bg: #1a1c20; --edit-fg: #fff;
  --font: "Pretendard", system-ui, sans-serif;
}
.app[data-d="A"][data-dark] {
  --bg: #11141b; --fg: #eef0f5; --muted: #9aa1b2; --card: #1b1f29; --chip: #262b37;
  --av-bg: #eef0f5; --av-fg: #11141b; --edit-bg: #eef0f5; --edit-fg: #11141b; --st-fill: #11141b;
}
.app[data-d="A"] .trip h1 { font-weight: 800; letter-spacing: -.02em; }
.app[data-d="A"] .stops { gap: 0; padding-left: 26px; }
.app[data-d="A"] .stop { background: transparent; border-radius: 0; padding: 12px 6px 16px 26px; }
.app[data-d="A"] .stop::before { /* 세로 노선 */
  content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 7px; background: var(--line);
}
.app[data-d="A"] .stop:first-child::before { top: 18px; }
.app[data-d="A"] .stop:last-child::before { bottom: calc(100% - 18px); }
.app[data-d="A"] .stop::after { /* 역 */
  content: ""; position: absolute; left: -3px; top: 12px; width: 21px; height: 21px; border-radius: 50%;
  background: var(--bg); border: 4px solid var(--line); box-sizing: border-box;
}
.app[data-d="A"] .stop .name { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 2px solid var(--line); }
.app[data-d="A"] .stop time { color: var(--muted); font-weight: 600; padding-top: 3px; }
.app[data-d="A"] .settle { border: 2px solid var(--fg); background: transparent; }
.app[data-d="A"] .stop .editing { top: 14px; right: 0; }

/* ============================================================
   B · 승차권 — "일정 카드 한 장이 한 장의 승차권"
   ============================================================ */
.app[data-d="B"] {
  --bg: #efe8da; --fg: #2b2620; --muted: #7a6f60; --card: #fffaf0; --chip: #e7dcc8;
  --av-bg: #2b2620; --av-fg: #fffaf0; --edit-bg: transparent; --edit-fg: #c2412d;
  --font: "IBM Plex Sans KR", system-ui, sans-serif; --num-font: "IBM Plex Mono", monospace;
  --fab-bg: #c2412d;
}
.app[data-d="B"][data-dark] {
  --bg: #1f1b17; --fg: #f1e9da; --muted: #a8998a; --card: #2c2722; --chip: #3a332c;
  --av-bg: #f1e9da; --av-fg: #1f1b17; --st-fill: #1f1b17; --edit-fg: #ff7a5f;
}
.app[data-d="B"] .day { border-radius: 4px; }
.app[data-d="B"] .stop {
  border-radius: 6px; grid-template-columns: 64px 1fr; padding: 14px 14px 14px 12px;
  /* 양쪽 펀치 구멍 */
  -webkit-mask: radial-gradient(circle 8px at 0 50%, #0000 98%, #000) left/51% 100% no-repeat,
                radial-gradient(circle 8px at 100% 50%, #0000 98%, #000) right/51% 100% no-repeat;
          mask: radial-gradient(circle 8px at 0 50%, #0000 98%, #000) left/51% 100% no-repeat,
                radial-gradient(circle 8px at 100% 50%, #0000 98%, #000) right/51% 100% no-repeat;
}
.app[data-d="B"] .stop time { border-right: 2px dashed var(--chip); padding-right: 8px; font-size: 17px; }
.app[data-d="B"] .stop time::before { content: "출발"; display: block; font-size: 10px; font-weight: 400; color: var(--muted); font-family: var(--font); }
.app[data-d="B"] .stop .name::after { content: " →"; color: var(--muted); font-weight: 400; }
.app[data-d="B"] .stop:last-child .name::after { content: ""; }
.app[data-d="B"] .stop .tags span { border-radius: 3px; text-transform: uppercase; font-family: var(--num-font); }
.app[data-d="B"] .stop .editing {
  top: 8px; right: 14px; border: 2px solid var(--edit-fg); border-radius: 4px; transform: rotate(-8deg);
  font-weight: 700; letter-spacing: .05em;
}
.app[data-d="B"] .route .rline { stroke-dasharray: 2 10; stroke-width: 4; animation: none; stroke-dashoffset: 0; }
.app[data-d="B"] .settle { border-radius: 6px; border-top: 2px dashed var(--chip); }

/* ============================================================
   C · 출발 안내판 — "바뀐 일정이 역 전광판처럼 넘어간다"
   ============================================================ */
.app[data-d="C"] {
  --bg: #0c0d0b; --fg: #ffb000; --muted: #a27a24; --card: #15170f; --chip: #1f2216;
  --av-bg: #2a2d1f; --av-fg: #ffb000; --edit-bg: #ffb000; --edit-fg: #0c0d0b;
  --font: "Nanum Gothic Coding", monospace; --st-fill: #0c0d0b;
  --fab-bg: #ffb000; --fab-fg: #0c0d0b;
}
.app[data-d="C"][data-dark] { /* C는 원래 어둡다 — 다크는 같은 값 */ }
.app[data-d="C"] .trip h1 { letter-spacing: .04em; }
.app[data-d="C"] .day { border-radius: 2px; background: var(--chip); color: var(--muted); }
.app[data-d="C"] .day.cur { background: var(--fg); color: var(--bg); }
.app[data-d="C"] .day.cur small { color: var(--bg); }
.app[data-d="C"] .stops { gap: 2px; }
.app[data-d="C"] .stops::before {
  content: "시각  행선지            비고"; white-space: pre; font-size: 11px; color: var(--muted); padding: 0 12px 4px;
}
.app[data-d="C"] .stop { border-radius: 2px; grid-template-columns: 58px 1fr; }
.app[data-d="C"] .stop time, .app[data-d="C"] .stop .name {
  display: inline-block; background: #000; padding: 2px 5px; border-radius: 2px;
  box-shadow: inset 0 -1px 0 #333, inset 0 9px 0 rgba(255,255,255,.03);
}
.app[data-d="C"] .stop .memo { color: #d9cfa8; }
.app[data-d="C"] .stop .tags span { border-radius: 2px; background: transparent; border: 1px solid var(--muted); color: var(--muted); }
.app[data-d="C"] .stop .editing { border-radius: 2px; top: 10px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.app[data-d="C"] .stop.moved .name, .app[data-d="C"] .stop.moved time { animation: flap .5s steps(4); }
@keyframes flap { 0% { transform: scaleY(1); } 25% { transform: scaleY(.1); } 50% { transform: scaleY(1); } 75% { transform: scaleY(.1); } }
.app[data-d="C"] .stop.moved { animation: none; }
.app[data-d="C"] .route .lbl { fill: var(--fg); }
.app[data-d="C"] .settle { border-radius: 2px; border: 1px solid var(--muted); }

/* ============================================================
   D · 여행 수첩 — "같이 채워 가는 여행 수첩"
   ============================================================ */
.app[data-d="D"] {
  --bg: #fbf6ea; --fg: #3a3328; --muted: #8a7d68; --card: #fffdf7; --chip: #efe5cf;
  --av-bg: #e9d7b0; --av-fg: #3a3328; --edit-bg: #fff3a8; --edit-fg: #3a3328;
  --font: "Gowun Batang", serif; --title-font: "Gaegu", cursive; --num-font: "Gaegu", cursive;
  background-image: repeating-linear-gradient(transparent 0 27px, #e8dcc3 27px 28px);
}
.app[data-d="D"][data-dark] {
  --bg: #1e1c18; --fg: #efe6d4; --muted: #a99d86; --card: #2a2722; --chip: #36322a;
  --av-bg: #4a4232; --av-fg: #efe6d4; --edit-bg: #6b5d22; --edit-fg: #fff6c9; --st-fill: #1e1c18;
  background-image: repeating-linear-gradient(transparent 0 27px, #2b2822 27px 28px);
}
.app[data-d="D"] .trip h1 { font-size: 30px; font-weight: 700; }
.app[data-d="D"] .day { border-radius: 2px 10px 2px 10px; }
.app[data-d="D"] .stop {
  border-radius: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.08);
}
.app[data-d="D"] .stop:nth-child(odd) { transform: rotate(-.8deg); }
.app[data-d="D"] .stop:nth-child(even) { transform: rotate(.7deg); }
.app[data-d="D"] .stop::before { /* 마스킹 테이프 */
  content: ""; position: absolute; top: -8px; left: 50%; width: 64px; height: 16px; margin-left: -32px;
  background: color-mix(in srgb, var(--line) 35%, transparent); transform: rotate(-3deg);
}
.app[data-d="D"] .stop time { font-size: 20px; }
.app[data-d="D"] .stop .editing { font-family: var(--title-font); font-size: 14px; border-radius: 2px; transform: rotate(4deg); }
.app[data-d="D"] .route .rline { stroke-width: 3; stroke-dasharray: 8 6; animation: none; stroke-dashoffset: 0; }
.app[data-d="D"] .route .lbl { font-family: "Gaegu", cursive; font-size: 13px; }
.app[data-d="D"] .settle { border-radius: 3px; font-family: var(--title-font); font-size: 18px; }
</style>
</head>
<body>

<header class="board-head" id="head">
  <h1>Itinerail · 디자인 방향 비교</h1>
  <p>같은 화면(일정 판, 모바일)을 방향 네 개로 그렸다. 예시 데이터는 지어낸 것이다. 날짜 칸을 누르면 날짜가 바뀌고, "옮기기 데모"는 다른 멤버가 카드를 옮긴 것처럼 순서를 바꾼다.<br>
  하나만 크게: <code>?d=A</code> ~ <code>?d=D</code> · 다크: <code>&amp;dark=1</code> · 편집 중 표시 끄기: <code>&amp;edit=0</code></p>
</header>
<main class="board" id="board"></main>

<script>
/* ---------- 예시 데이터 (지어낸 것) ---------- */
const TRIP = { name: "후쿠오카 2박 3일", dates: "12.19 – 12.21 · 3명 · ¥ JPY" };
const DAYS = [
  { label: "1일차", sub: "12.19 금", color: { A: "#00a84d", B: "#2f6b4f", C: "#ffb000", D: "#5b8a5a" },
    stops: [
      { id: "s1", t: "10:40", name: "하카타역", memo: "짐은 역 코인로커에", tags: ["이동"] },
      { id: "s2", t: "12:00", name: "라멘 골목", memo: "줄 길면 옆 가게로", tags: ["맛집", "필수"] },
      { id: "s3", t: "14:30", name: "캐널시티", memo: "분수 쇼 15:00", tags: ["구경"], editing: "도윤" },
      { id: "s4", t: "19:00", name: "강변 포장마차", memo: "현금 챙기기", tags: ["맛집"] },
    ] },
  { label: "2일차", sub: "12.20 토", color: { A: "#f5a200", B: "#9a5a1c", C: "#ffb000", D: "#c28a3e" },
    stops: [
      { id: "s5", t: "09:30", name: "텐진 버스터미널", memo: "왕복표 미리", tags: ["이동"] },
      { id: "s6", t: "11:00", name: "온천 마을", memo: "족욕 + 산책", tags: ["필수"] },
      { id: "s7", t: "15:30", name: "호숫가 카페", memo: "", tags: ["카페"] },
    ] },
  { label: "3일차", sub: "12.21 일", color: { A: "#0052a4", B: "#3c4f7a", C: "#ffb000", D: "#4f6a8f" },
    stops: [
      { id: "s8", t: "10:00", name: "신사 산책", memo: "오전에 덜 붐빔", tags: ["구경"] },
      { id: "s9", t: "13:00", name: "공항", memo: "출발 15:20", tags: ["이동"] },
    ] },
];
const MEMBERS = [ { n: "나", day: 0 }, { n: "서", day: 1, on: true }, { n: "도", day: 0, on: true } ];
const DIRS = {
  A: { title: "A · 노선도", one: "하루가 한 노선, 장소는 역. 지하철 노선도의 굵은 선 · 역 동그라미 · 노선 색." },
  B: { title: "B · 승차권", one: "일정 카드 한 장이 한 장의 승차권. 절취선 · 펀치 구멍 · 고정폭 숫자 · 도장." },
  C: { title: "C · 출발 안내판", one: "바뀐 일정이 역 전광판처럼 넘어간다. 어두운 판 · 호박색 글자 · 깜빡이는 '변경 중'." },
  D: { title: "D · 여행 수첩", one: "같이 채워 가는 여행 수첩. 줄 노트 · 손글씨 제목 · 마스킹 테이프 · 연필 동선." },
};

const q = new URLSearchParams(location.search);
const dark = q.get("dark") === "1";
const showEdit = q.get("edit") !== "0";

/* ---------- 앱 하나 그리기 ---------- */
function makeApp(d) {
  const app = document.createElement("div");
  app.className = "app"; app.dataset.d = d;
  if (dark) app.dataset.dark = "";
  const state = { day: 0, order: DAYS.map(x => x.stops.map(s => s.id)), moved: null };
  const draw = () => {
    const day = DAYS[state.day];
    const color = day.color[d];
    app.style.setProperty("--line", color);
    app.style.setProperty("--day-color", color);
    const stops = state.order[state.day].map(id => day.stops.find(s => s.id === id));
    app.innerHTML = `
      <header class="top">
        <div class="trip"><h1>${TRIP.name}</h1><p class="dates">${TRIP.dates}</p></div>
        <div class="members">${MEMBERS.map(m => `<span class="av ${m.on || m.n === "나" ? "" : "off"}" title="${m.n}">${m.n}${m.on ? `<span class="here">${m.day + 1}</span>` : ""}</span>`).join("")}</div>
      </header>
      <nav class="days">${DAYS.map((x, i) => `<button class="day ${i === state.day ? "cur" : ""}" data-i="${i}">${x.label}<small>${x.sub}</small></button>`).join("")}</nav>
      <section class="route">${routeSvg(stops)}</section>
      <ol class="stops">${stops.map(s => `
        <li class="stop ${state.moved === s.id ? "moved" : ""}" style="view-transition-name:${d}-${s.id}">
          <time>${s.t}</time>
          <div class="body"><span class="name">${s.name}</span>${s.memo ? `<p class="memo">${s.memo}</p>` : ""}
            <div class="tags">${s.tags.map(t => `<span>${t}</span>`).join("")}</div></div>
          ${showEdit && s.editing ? `<span class="editing">${s.editing} 편집 중</span>` : ""}
        </li>`).join("")}
      </ol>
      <div class="settle"><span>정산</span><b>도윤에게 ¥3,200 보내기</b></div>
      <div class="demo"><button data-act="move">옮기기 데모</button></div>
      <button class="fab">＋ 일정</button>`;
    app.querySelectorAll(".day").forEach(b => b.onclick = () => go(() => { state.day = +b.dataset.i; state.moved = null; }));
    app.querySelector("[data-act=move]").onclick = () => go(() => {
      const o = state.order[state.day];
      const id = o.splice(1, 1)[0]; o.push(id); state.moved = id;
    });
  };
  const go = (fn) => {
    if (document.startViewTransition) document.startViewTransition(() => { fn(); draw(); });
    else { fn(); draw(); }
  };
  draw();
  return app;
}

/* 노선도 띠: 역을 같은 간격으로 놓고 선으로 잇는다 (위경도 없이 순서만) */
function routeSvg(stops) {
  const W = 354, y = 30, n = stops.length;
  const xs = stops.map((_, i) => n === 1 ? W / 2 : 16 + i * (W - 32) / (n - 1));
  const path = n > 1 ? `<path class="rline" pathLength="1" d="M${xs[0]} ${y} L${xs[n - 1]} ${y}"/>` : "";
  return `<svg viewBox="0 0 ${W} 92" aria-label="오늘 동선">${path}
    ${xs.map((x, i) => `<circle class="st" cx="${x}" cy="${y}" r="9"/>
      <text class="lbl" x="${x}" y="${y + 30}" text-anchor="middle">${stops[i].name.length > 6 ? stops[i].name.slice(0, 6) + "…" : stops[i].name}</text>`).join("")}
  </svg>`;
}

/* ---------- 보드 / 하나만 ---------- */
const board = document.getElementById("board");
const only = q.get("d");
if (only && DIRS[only]) {
  document.body.classList.add("single");
  document.getElementById("head").hidden = true;
  board.style.gridTemplateColumns = "390px";
  addSlot(only);
  const sw = document.createElement("nav");
  sw.className = "switcher";
  const link = (p) => { const u = new URLSearchParams(q); Object.entries(p).forEach(([k, v]) => v === null ? u.delete(k) : u.set(k, v)); return "?" + u; };
  sw.innerHTML = Object.keys(DIRS).map(k => `<a class="${k === only ? "cur" : ""}" href="${link({ d: k })}">${k}</a>`).join("")
    + `<a href="${link({ dark: dark ? null : "1" })}">${dark ? "라이트" : "다크"}</a><a href="${link({ d: null })}">보드로</a>`;
  document.body.append(sw);
} else {
  Object.keys(DIRS).forEach(addSlot);
}
function addSlot(k) {
  const slot = document.createElement("section");
  slot.className = "slot";
  slot.innerHTML = `<h2>${DIRS[k].title}</h2><p class="one">${DIRS[k].one} <a href="?d=${k}${dark ? "&dark=1" : ""}">크게 보기</a></p>`;
  const frame = document.createElement("div");
  frame.className = "frame";
  frame.append(makeApp(k));
  slot.append(frame);
  board.append(slot);
}
</script>
